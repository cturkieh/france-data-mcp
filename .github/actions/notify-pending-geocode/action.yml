# Composite action — alerte ops "adresses restant à géocoder (BAN)".
#
# Factorise les steps (check → email → issue) partagés par les crons RPPS et
# Ameli (seuls à poser des adresses BAN). Le re-géocodage est désormais AUTOMATISÉ
# (drain BAN déclenché en `workflow_run` après chaque cron réussi — cf.
# `ban-backfill-{rpps,ameli}.yml`) : l'alerte « résidu normal » est INFORMATIVE
# (géocodé tout seul, aucune action requise) ; seule la mesure indisponible reste
# une vraie anomalie actionnable.
#
# Décision ET wording (email + issue) vivent dans
# `scripts/ingest/notify-pending-geocode.ts` (TS testé) ; ce YAML ne fait que
# transporter les outputs vers les deux émetteurs uniques (`send-ops-email`,
# `upsert-ops-issue`). Plus AUCUN texte composé ici : un heredoc bash
# multi-ligne a cassé le parse de cette composite le 2026-09-06 (revue), ce que
# le garde-fou textuel ne voyait pas — d'où le test de parse YAML.
#
# Best-effort de bout en bout : tourne APRÈS une ingestion déjà réussie (swap
# fait), donc ne doit JAMAIS re-marquer le cron en échec. Le script ne throw pas
# (exit 0, crash hors script annoté par le `||`), l'email avale son échec en
# `::warning::`, l'issue en `core.warning`. Le call-site ajoute
# `continue-on-error: true` en ceinture-bretelles. NB : `continue-on-error`
# par-step n'existe PAS dans une composite action (limitation GitHub).
name: Notify pending BAN geocoding
description: >
  Alerte (email Resend + issue GitHub idempotente) quand un cron d'ingestion a
  posé de nouvelles adresses restant à géocoder via BAN.

inputs:
  source:
    description: "Slug source (arg CLI du script) : rpps | ameli."
    required: true
  supabase-url:
    description: "URL du projet Supabase."
    required: true
  supabase-service-role-key:
    description: "Clé service_role (lecture ingest_log)."
    required: true
  resend-api-key:
    description: "Clé API Resend. Vide → email skippé avec ::warning:: (l'issue reste créée)."
    required: false
    default: ""
  email-to:
    description: "Destinataire de l'alerte mail."
    required: false
    default: "cturkieh@gmail.com"
  email-from:
    description: "Expéditeur (domaine vérifié Resend, sinon onboarding@resend.dev)."
    required: false
    default: "France Data MCP <onboarding@resend.dev>"
  github-token:
    description: "Token pour créer/commenter l'issue."
    required: true
  run-url:
    description: "URL du run GitHub Actions (traçabilité)."
    required: true

runs:
  using: composite
  steps:
    - name: Check pending BAN geocoding
      id: pending_geocode
      shell: bash
      env:
        SUPABASE_URL: ${{ inputs.supabase-url }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ inputs.supabase-service-role-key }}
        GITHUB_RUN_URL: ${{ inputs.run-url }}
        # Input passé via env (jamais interpolé dans le shell = anti-injection,
        # convention des workflows du repo).
        SOURCE: ${{ inputs.source }}
      run: pnpm notify:pending-geocode "$SOURCE" || echo "::error::notify-pending-geocode ($SOURCE) CRASHÉ avant d'écrire sa décision — aucune alerte pour ce run"

    # Émission déléguée à l'émetteur unique (best-effort : un échec d'envoi ne
    # court-circuite pas le step issue qui suit — sinon une panne Resend
    # supprimerait AUSSI l'issue).
    - name: Email — adresses à géocoder
      if: steps.pending_geocode.outputs.should_notify == 'true'
      uses: ./.github/actions/send-ops-email
      with:
        resend-api-key: ${{ inputs.resend-api-key }}
        email-to: ${{ inputs.email-to }}
        email-from: ${{ inputs.email-from }}
        subject: ${{ steps.pending_geocode.outputs.subject }}
        text: ${{ steps.pending_geocode.outputs.text }}

    # `always() &&` : un échec de l'email (action locale non résolue, Resend
    # KO) ne doit PAS supprimer l'issue — les deux canaux sont indépendants par
    # contrat. Titre/corps viennent du même step que `should_notify` : s'ils
    # manquaient malgré tout, `upsert-ops-issue` crée une issue de repli.
    - name: Issue — adresses à géocoder
      if: always() && steps.pending_geocode.outputs.should_notify == 'true'
      uses: ./.github/actions/upsert-ops-issue
      with:
        # Idempotence : le résidu BAN est récurrent, une seule issue de
        # surveillance suffit (les runs suivants la commentent). Les labels
        # viennent du SCRIPT (registre informatif `pending-geocode,<source>` vs
        # DÉGRADÉ `pending-geocode-measure,<source>`) : le drain BAN ne referme
        # que le premier — un drain réussi ne dit rien de l'état de la RPC de
        # mesure, et le filtre `labels` de l'API étant un ET, un simple label
        # de plus n'aurait pas suffi à l'en protéger.
        labels: ${{ steps.pending_geocode.outputs.issue_labels }}
        title: ${{ steps.pending_geocode.outputs.issue_title }}
        body: ${{ steps.pending_geocode.outputs.issue_body }}
        comment: ${{ steps.pending_geocode.outputs.issue_comment }}
        github-token: ${{ inputs.github-token }}
        run-url: ${{ inputs.run-url }}
