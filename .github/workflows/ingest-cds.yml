# .github/workflows/ingest-cds.yml
name: Ingest Centres de Santé (CDS)

on:
  schedule:
    # Mondays 06:00 UTC. CNAM regenerate l'extract dans la nuit dimanche → lundi
    # (documenté §2.B doc PDF). On laisse 2h de marge après le slot Ameli (04:00)
    # pour ne pas saturer le rate limit data.gouv.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

# Never run on pull_request - secrets are not available there, by design.

permissions:
  contents: read
  issues: write

concurrency:
  group: ingest-cds
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # CDS = ~3 Mo CSV / ~3K CDS uniques (post-dédup) + 35K commune fetch.
    # Full run < 2 min en local ; 15 min couvrent les jours data.gouv lents
    # et la contention PostgREST.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - uses: actions/setup-node@v6
        with:
          # Node 22 pour WebSocket natif — même raison que finess/ameli.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CDS ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: pnpm ingest:cds

      # Vigie « run vert mais donnée malade » : run `partial` (canary/matview)
      # ou source TARIE (skips same_checksum au-delà de la cadence attendue).
      # `success()` : ne s'évalue que sur un cron réussi (le failed/cancelled a
      # son step) ; `continue-on-error` : une notif KO ne re-rouge jamais un
      # cron déjà réussi (swap fait). Cf. `.github/actions/notify-ingest-anomaly`.
      - name: Notify ingest anomaly
        if: success()
        continue-on-error: true
        uses: ./.github/actions/notify-ingest-anomaly
        with:
          source: cds
          supabase-url: ${{ secrets.SUPABASE_URL }}
          supabase-service-role-key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          resend-api-key: ${{ secrets.RESEND_API_KEY }}
          email-to: ${{ vars.NOTIFY_EMAIL_TO || 'cturkieh@gmail.com' }}
          email-from: ${{ vars.NOTIFY_EMAIL_FROM || 'France Data MCP <onboarding@resend.dev>' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # Échec OU run tué (`cancelled()` = timeout-minutes / annulation ; cf.
      # `.github/actions/notify-ingest-failure` — sans lui, un run tué est muet).
      - name: Alert on failure or cancelled run
        if: failure() || cancelled()
        uses: ./.github/actions/notify-ingest-failure
        with:
          source-label: CDS
          ingest-log-source: cds
          issue-labels: ingestion-failure,cds
          failure-modes: "CDS_CSV_URL stale (resource id rotated par CNAM), unmatched_locality > 5% (INSEE drift), CDS count < 2K (troncature CSV), structural skips > 1% (rename colonne CNAM)."
          job-status: ${{ job.status }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          resend-api-key: ${{ secrets.RESEND_API_KEY }}
          email-to: ${{ vars.NOTIFY_EMAIL_TO || 'cturkieh@gmail.com' }}
          email-from: ${{ vars.NOTIFY_EMAIL_FROM || 'France Data MCP <onboarding@resend.dev>' }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
