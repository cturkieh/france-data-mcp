# Drain BAN FINESS — appelant du corps unique `ban-backfill.yml` (workflow_call).
# Géocode le résiduel d'établissements SANS point (nouveaux EGE du flux ANS ;
# chiffres mesurés : migration 20260906T120000) et remplit le cache
# `geocoded_addresses` ; les coords sont POSÉES dans `finess` au prochain cron
# via `ingest_apply_finess_ban_join` (décalage d'UNE passe, par design).
#
# DEUX déclencheurs :
#  - AUTO : à la complétion RÉUSSIE du cron « Ingest FINESS » (`workflow_run`) →
#    les nouveaux établissements de chaque quinzaine sont drainés sans clic ;
#  - MANUEL : `workflow_dispatch` (bouton de secours + canari via input `max`).
#
# Énumération keyset sur `num_finess` (PK CHAR(9), curseur TEXTE) via
# `finess_eligible_rows_after_id` — AUCUN index à construire (bitmap index scan
# sur `finess_geom_gist`, ~0,5 s par page mesuré). Adresse = `voie` seule (porte
# déjà numéro + type de voie). Les EGE sans voie ne sont PAS éligibles : pas de
# centroïde commune dans finess.geom (il contaminerait le RPPS en `finess_join`).
name: Backfill BAN FINESS (auto + manuel)

on:
  workflow_dispatch:
    inputs:
      max:
        description: "Nb max de NOUVELLES adresses géocodées ce run (canari, ex. 1000). Vide = drainage complet."
        type: string
        required: false
        default: ""
  # AUTO post-ingestion : déclenché à la complétion du cron FINESS. La garde
  # `conclusion == 'success'` (niveau job) évite de drainer après une ingestion
  # ÉCHOUÉE (données non fiables). Sur cet événement, `inputs.max` est vide → drain complet.
  workflow_run:
    workflows: ["Ingest FINESS"]
    types: [completed]

# Redéclarées ICI : GitHub calcule les permissions du job appelant, le workflow
# appelé ne peut qu'en hériter (ou en avoir moins) — les omettre rendrait
# l'alerte et la fermeture d'issue muettes.
permissions:
  contents: read
  issues: write

# JAMAIS concurrent du cron FINESS : son swap atomique renommerait `finess` en
# pleine énumération keyset. Même groupe que ingest-finess.yml → sérialisés.
concurrency:
  group: ingest-finess
  cancel-in-progress: false

jobs:
  backfill:
    # MANUEL → toujours ; AUTO (workflow_run) → seulement si l'ingestion a RÉUSSI
    # (une ingestion échouée n'a pas produit de nouvelles données fiables à géocoder).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/ban-backfill.yml
    secrets: inherit
    with:
      source: finess
      source-label: FINESS
      issue-labels: backfill-failure,finess
      failure-modes: "Géocodage BAN indisponible ou lent sur les DEUX hôtes (data.geopf.fr puis repli api-adresse — réessayer plus tard), RPC d'énumération keyset absente (migration 20260906T120000 non appliquée), secrets Supabase manquants (preflight), curseur num_finess divergent de la RETURNS TABLE (throw fail-loud, jamais une boucle)."
      killed-hint: "Le drain BAN remplit le cache geocoded_addresses au fil de l'eau (idempotent) : relancer via workflow_dispatch pour finir le drain ; les coords sont posées dans `finess` au prochain cron FINESS (1er/15, `ingest_apply_finess_ban_join`) ou via workflow_dispatch « Ingest FINESS » avec force."
      # Vide sur `workflow_run` (contexte `inputs` absent) → drain complet.
      max: ${{ inputs.max || '' }}
