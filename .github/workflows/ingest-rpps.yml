# .github/workflows/ingest-rpps.yml
name: Ingest RPPS Annuaire Sante ANS

on:
  schedule:
    # 5th of the month, 04:00 UTC. ANS regenerates the RPPS extract monthly
    # (typically published on the 1st-3rd). Day-5 catches the freshest version
    # while leaving FINESS (1st/15th) and Ameli (Mondays) their own slots.
    - cron: "0 4 5 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Forcer la ré-ingestion même si le fichier RPPS est identique au dernier run (bypass court-circuit SHA256). Run complet ~57 min + swap atomique. À utiliser pour réappliquer le cache BAN géocodé jamais posé."
        type: boolean
        default: false

# Never run on pull_request - secrets are not available there, by design.

permissions:
  contents: read
  issues: write

concurrency:
  group: ingest-rpps
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # RPPS is ~803 MB CSV / ~2.23 M rows + 35 K commune fetch. A full
    # ingestion runs in ~15-25 minutes locally; 60 minutes leaves head room
    # for slow data.gouv days and PostgREST contention.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - uses: actions/setup-node@v6
        with:
          # Node 22 for native WebSocket - aligned with FINESS / Ameli workflows.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run RPPS ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Input booléen typé du workflow_dispatch (jamais du texte libre) →
          # "1" si coché, sinon "0". Cron planifié = inputs absent → falsy → "0".
          # ⚠️ NE JAMAIS remplacer `inputs.force` par `github.event.inputs.force` :
          # ce dernier STRINGIFIE le booléen → la string "false" est TRUTHY en
          # expression Actions → `"false" && '1'` = '1' → force à CHAQUE cron
          # (run 57 min + swap non voulus). Le contexte `inputs` PRÉSERVE le
          # booléen (doc GitHub Actions) — c'est load-bearing, ne pas toucher.
          FORCE_REINGEST: ${{ inputs.force && '1' || '0' }}
        run: pnpm ingest:rpps

      # Alerte ops : adresses restant à géocoder (BAN) après ce run — logique
      # partagée RPPS/Ameli dans la composite action. `continue-on-error` :
      # une notif KO ne re-rouge jamais un cron déjà réussi (swap fait).
      - name: Notify pending BAN geocoding
        if: success()
        continue-on-error: true
        uses: ./.github/actions/notify-pending-geocode
        with:
          source: rpps
          source-label: RPPS
          supabase-url: ${{ secrets.SUPABASE_URL }}
          supabase-service-role-key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          resend-api-key: ${{ secrets.RESEND_API_KEY }}
          email-to: ${{ vars.NOTIFY_EMAIL_TO || 'cturkieh@gmail.com' }}
          email-from: ${{ vars.NOTIFY_EMAIL_FROM || 'France Data MCP <onboarding@resend.dev>' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[ingestion-failure] RPPS run failed (run #${context.runId})`,
              body: `The RPPS Annuaire Sante ANS ingestion workflow failed.\n\n` +
                    `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
                    `Check the \`ingest_log\` table for the latest \`failed\` row (source = 'rpps') to see error_phase and error_message. ` +
                    `Common failure modes: RPPS_CSV_URL stale (resource id rotated, override via env if needed), unmatched_locality > 8% (INSEE drift), structural anomaly > 1% (column rename), row count out of [1.8M, 2.6M] bounds (format change).`,
              labels: ['ingestion-failure', 'rpps'],
            })
