# .github/workflows/cleanup-stale-previous.yml
name: Cleanup stale <source>_previous

on:
  schedule:
    # Tous les jours à 03:00 UTC (hebdomadaire jusqu'en 2026-11). Chaque bascule
    # garde l'ancienne table en `<prod>_previous` ; ce job la supprime 4 jours
    # après le dernier run de la source (`DROP_STALE_PREVIOUS_DEFAULT_DAYS`).
    # Quotidien pour que la copie vive 4 jours quel que soit le jour du
    # rechargement : en hebdomadaire, celle du RPPS (2 Go) restait 7 à 13 jours
    # et gonflait le pic disque du lundi (Ameli). Le disque Supabase est facturé
    # à sa taille réservée et ne rétrécit pas seul.
    #
    # L'heure ne protège de RIEN : GitHub retarde les crons de plusieurs heures
    # (03:00 planifié, 10:40 observé), donc ce job peut tomber pendant une
    # ingestion, ou le lendemain d'un run tué juste après sa bascule. C'est la
    # garde de `scripts/ingest/ingest-run-guard.ts`, appelée par la CLI, qui
    # protège : rien n'est nettoyé tant qu'un run d'un workflow `ingest-*` est
    # récent et pas terminé en succès.
    #
    # NOTE: GitHub disables scheduled workflows after 60 days WITHOUT any
    # repository activity (push/PR). Since this repo receives weekly commits,
    # the schedule stays alive; if activity drops, the cleanup silently stops
    # and `<source>_previous` will accumulate disk. If long inactivity is
    # expected, set up an external monitor (Sentry cron / healthcheck.io ping).
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      max_age_days:
        # Pas de `default` ici : si l'input est omis, la step ci-dessous garde
        # l'override désactivé et le CLI applique `DROP_STALE_PREVIOUS_DEFAULT_DAYS`
        # (`scripts/ingest/shared.ts`) — une seule source de vérité côté code.
        description: "Override the staleness threshold (1-365 days). Vide = défaut du code (4j)."
        required: false
      dry_run:
        description: "Simulation : affiche ce qui serait supprimé, n'appelle pas la RPC, n'écrit rien."
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  # Lecture des runs d'ingestion par la garde de la CLI (`ingest-run-guard.ts`).
  actions: read

concurrency:
  group: cleanup-stale-previous
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    # Réaliste : checkout + pnpm install ≈ 30-60 s, puis 7 lectures de l'API
    # GitHub et, par table, 1 à 2 lectures d'`ingest_log` et 1 RPC : < 2 min.
    # Cap 5 min : une dérive à plusieurs minutes est un signal fort.
    timeout-minutes: 5
    env:
      # Pre-validate l'input AVANT install pour échouer fast si bornes violées.
      # Pass via env: plutot qu'interpolation directe dans `run:` — durcissement
      # standard GitHub Actions (évite toute interpolation imprévue côté shell).
      MAX_AGE_DAYS: ${{ github.event.inputs.max_age_days }}
    steps:
      # Checkout EN PREMIER : l'alerte d'échec est une action LOCALE
      # (`./.github/actions/notify-ingest-failure`), lue dans le workspace —
      # sans checkout, un preflight qui échoue rendrait l'alerte MUETTE
      # (exactement la panne « secrets manquants » qu'elle doit rapporter).
      # Le preflight reste AVANT `pnpm install` (le poste coûteux).
      - uses: actions/checkout@v6

      - name: Validate max_age_days bounds
        if: env.MAX_AGE_DAYS != ''
        run: |
          if ! [[ "$MAX_AGE_DAYS" =~ ^[0-9]+$ ]] || (( MAX_AGE_DAYS < 1 || MAX_AGE_DAYS > 365 )); then
            echo "::error::max_age_days must be an integer in [1, 365], got '$MAX_AGE_DAYS'"
            exit 1
          fi

      - name: Validate required secrets present
        # Fail-fast clair AVANT `pnpm install` (le checkout reste en 1er, cf. ci-dessus) (~30-60s) si SUPABASE_URL ou
        # SUPABASE_SERVICE_ROLE_KEY est absent : sinon le throw du CLI Node
        # « Missing SUPABASE_URL » est moins lisible dans les logs GH que
        # cette `::error::` annotation, et arrive après l'install pnpm.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=()
          [ -z "$SUPABASE_URL" ] && missing+=("SUPABASE_URL")
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing+=("SUPABASE_SERVICE_ROLE_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Required repository secret(s) missing: ${missing[*]}"
            exit 1
          fi

      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `GITHUB_TOKEN` n'est PAS optionnel : la CLI s'en sert pour vérifier qu'aucune
      # ingestion ne tourne ni n'a été tuée récemment, et refuse de nettoyer sans
      # lui. Ne jamais passer `--no-ingest-guard` ici (réservé à un opérateur).
      - name: Run cleanup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          args=()
          [ -n "$MAX_AGE_DAYS" ] && args+=("--max-age-days=$MAX_AGE_DAYS")
          [ "$DRY_RUN" = "true" ] && args+=("--dry-run")
          pnpm cleanup:stale-previous "${args[@]}"

      # Échec OU run tué (`cancelled()` = timeout-minutes / annulation ; cf.
      # `.github/actions/notify-ingest-failure` — sans lui, un run tué est muet).
      - name: Alert on failure or cancelled run
        if: failure() || cancelled()
        uses: ./.github/actions/notify-ingest-failure
        with:
          source-label: Cleanup stale-previous
          ingest-log-source: "" # le cleanup n'écrit pas ingest_log
          issue-labels: cleanup-failure
          failure-modes: "Cleanup best-effort et idempotent — relancer via workflow_dispatch une fois la cause corrigée. Échec structurel (dérive de contrat RPC, migration de schéma) : le log du run nomme la source fautive. Erreur 2BP01 « cannot drop table … because other objects depend on it » : un objet est encore lié à la copie de secours, rien n'a été supprimé, le message nomme l'objet. Matview (après un run d'ingestion interrompu ou partial) : reconstruire celles de la source (ingest_rebuild_rpps_matviews, ingest_rebuild_rpps_search_lists, ingest_rebuild_ameli_matviews, ingest_rebuild_finess_hosted_activities) ou relancer son ingestion. Vue iris_full (après toute bascule IRIS) : la recréer, définition dans la migration 20260528T220000. Le nettoyage suivant passe alors seul. Les échecs par source ne cascadent PAS (chaque <source>_previous est traité indépendamment ; exit 1 si UNE source a échoué)."
          killed-hint: "Le cleanup est idempotent : relancer via workflow_dispatch, aucune donnée servie n'est touchée."
          job-status: ${{ job.status }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          resend-api-key: ${{ secrets.RESEND_API_KEY }}
          email-to: ${{ vars.NOTIFY_EMAIL_TO || 'cturkieh@gmail.com' }}
          email-from: ${{ vars.NOTIFY_EMAIL_FROM || 'France Data MCP <onboarding@resend.dev>' }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
