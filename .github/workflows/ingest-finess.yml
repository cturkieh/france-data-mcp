# .github/workflows/ingest-finess.yml
name: Ingest FINESS

on:
  schedule:
    # 1st and 15th of each month at 04:00 UTC. Since 2026-09-05 the source is
    # the ANS daily JSON feed (the DREES CSV stopped on 2026-07-20) — the
    # bimonthly cadence is ours, not the publisher's (~105 K rows, ~90 s).
    - cron: "0 4 1,15 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Forcer la ré-ingestion même si le fichier ANS est identique au dernier run (bypass court-circuit SHA256). Run complet ~2 min + swap atomique."
        type: boolean
        default: false

# Never run on pull_request — secrets are not available there, by design.

# Explicit permissions: orgs that enforce read-only default GITHUB_TOKEN
# would otherwise silently fail to open the failure issue.
permissions:
  contents: read
  issues: write

concurrency:
  group: ingest-finess
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - uses: actions/setup-node@v6
        with:
          # Node 22 has native WebSocket. @supabase/realtime-js eagerly
          # initializes a RealtimeClient when createClient runs, even if we
          # never use realtime — Node 20 doesn't have native WebSocket so
          # the client crashes on init. Bumping fixes it without adding
          # the `ws` package as a runtime dep.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run FINESS ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Input booléen typé du workflow_dispatch → "1" si coché, sinon "0".
          # Cron planifié = inputs absent → falsy → "0".
          # ⚠️ NE JAMAIS remplacer `inputs.force` par `github.event.inputs.force` :
          # ce dernier STRINGIFIE le booléen → la string "false" est TRUTHY en
          # expression Actions → force à CHAQUE cron. Le contexte `inputs`
          # PRÉSERVE le booléen — load-bearing, même règle que ingest-rpps.yml.
          FORCE_REINGEST: ${{ inputs.force && '1' || '0' }}
        run: pnpm ingest:finess

      # Vigie « run vert mais donnée malade » : run `partial` (canary/matview)
      # ou source TARIE (skips same_checksum au-delà de la cadence attendue).
      # `success()` : ne s'évalue que sur un cron réussi (le failed/cancelled a
      # son step) ; `continue-on-error` : une notif KO ne re-rouge jamais un
      # cron déjà réussi (swap fait). Cf. `.github/actions/notify-ingest-anomaly`.
      - name: Notify ingest anomaly
        if: success()
        continue-on-error: true
        uses: ./.github/actions/notify-ingest-anomaly
        with:
          source: finess
          supabase-url: ${{ secrets.SUPABASE_URL }}
          supabase-service-role-key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          resend-api-key: ${{ secrets.RESEND_API_KEY }}
          email-to: ${{ vars.NOTIFY_EMAIL_TO || 'cturkieh@gmail.com' }}
          email-from: ${{ vars.NOTIFY_EMAIL_FROM || 'France Data MCP <onboarding@resend.dev>' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # Échec OU run tué (`cancelled()` = timeout-minutes / annulation ; cf.
      # `.github/actions/notify-ingest-failure` — sans lui, un run tué est muet).
      - name: Alert on failure or cancelled run
        if: failure() || cancelled()
        uses: ./.github/actions/notify-ingest-failure
        with:
          source-label: FINESS
          ingest-log-source: finess
          issue-labels: ingestion-failure,finess
          job-status: ${{ job.status }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          resend-api-key: ${{ secrets.RESEND_API_KEY }}
          email-to: ${{ vars.NOTIFY_EMAIL_TO || 'cturkieh@gmail.com' }}
          email-from: ${{ vars.NOTIFY_EMAIL_FROM || 'France Data MCP <onboarding@resend.dev>' }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
