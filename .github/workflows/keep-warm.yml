# .github/workflows/keep-warm.yml
name: Keep warm MCP server

on:
  schedule:
    # Toutes les 10 minutes. Postgres garde les hot tuples ~minutes dans le
    # buffer cache (effective_cache_size partagé), un Vercel lambda warm
    # dure ~5 min avant cold restart. 10 min = sweet spot couverture / coût.
    #
    # NOTE : GitHub disables scheduled workflows after 60 days WITHOUT
    # repository activity. Vu la cadence de commits sur ce repo, pas un
    # risque immédiat — mais si activité chute, le keep-warm s'arrêtera
    # silencieusement et les 57014 cold-start reviendront. Watch via Sentry.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  # Aucun write nécessaire — pas d'ouverture d'issue sur échec ponctuel
  # (le keep-warm est best-effort, un run raté de temps en temps n'est pas
  # un signal opérationnel utile). Si la latence dérive STRUCTURELLEMENT,
  # Sentry capturera les 57014 sur les vrais appels LLM clients.
  contents: read

concurrency:
  group: keep-warm
  # Si un run précédent traîne (>10 min), on annule et on prend le nouveau —
  # un keep-warm en retard n'a pas de valeur, mieux vaut le suivant à l'heure.
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ubuntu-latest
    # Cap dur. Un run normal = 5-15s (4 curl). 2 min = signal fort de dérive
    # (lambda Vercel HS, Supabase down, ou rate-limit Upstash en train de
    # bloquer). Le timeout-minutes coupe avant de gaspiller du runtime GH.
    timeout-minutes: 2
    env:
      # URL publique du serveur MCP — pas de secret, le boundary auth est
      # côté lambda Vercel (rate-limit IP via Upstash, pas d'auth caller).
      MCP_URL: https://france-data-mcp.vercel.app
    steps:
      - name: Health check
        # Chauffe le lambda Vercel + valide la config env (Supabase, Sentry,
        # Axiom, Upstash, INSEE_SIRENE, ANS_FHIR). Pas de hit Postgres.
        # --fail-with-body : sur 5xx, curl exit non-zéro MAIS affiche le body
        # (HTML d'erreur Vercel, message JSON) → diagnostic visible dans les
        # logs GH Actions plutôt qu'un `exit 22` muet (gotcha curl -f standard).
        run: |
          response=$(curl -sSL --fail-with-body --max-time 10 "$MCP_URL/healthz")
          echo "$response" | jq -e '.status == "ok"' > /dev/null
          version=$(echo "$response" | jq -r '.version')
          echo "::notice::healthz ok (version=$version)"

      - name: Warm data_freshness (ingest_log read)
        # Lit `ingest_log` via la matview de fraîcheur. Touche une table
        # petite (~50 rows), plan stable. Chauffe le pool PostgREST + le
        # cache schema. JSON-RPC stateless, pas de handshake initialize.
        run: |
          response=$(curl -sSL --fail-with-body --max-time 20 -X POST "$MCP_URL/mcp" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"data_freshness","arguments":{}}}')
          # Le response MCP wrappe le résultat dans `result.content[0].text` (JSON-RPC).
          # On vérifie qu'il n'y a pas d'erreur top-level.
          if echo "$response" | jq -e '.error' > /dev/null; then
            echo "::error::data_freshness returned JSON-RPC error: $response"
            exit 1
          fi
          echo "::notice::data_freshness ok"

      - name: Warm finess_by_num_finess (PK lookup)
        # PK lookup sur table FINESS (93K rows). Reproduit exactement le
        # path qui a timeouté à 21:06 le 27/05 (verifier_site_actif appelle
        # cette RPC). Si elle timeout malgré la migration 15s, on a un vrai
        # problème structurel à investiguer.
        run: |
          response=$(curl -sSL --fail-with-body --max-time 20 -X POST "$MCP_URL/mcp" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"verifier_site_actif","arguments":{"num_finess":"920028487"}}}')
          if echo "$response" | jq -e '.error' > /dev/null; then
            echo "::error::verifier_site_actif returned JSON-RPC error: $response"
            exit 1
          fi
          echo "::notice::verifier_site_actif (PK FINESS) ok"

      - name: Warm finess_by_categorie (index scan)
        # Index scan finess(code_insee, categorie_code) sur Lille (59350) +
        # famille labo. Reproduit le path qui a timeouté en parallèle des
        # autres RPCs lors du test live. Limit 1 = warmup minimal, pas un
        # load test.
        run: |
          response=$(curl -sSL --fail-with-body --max-time 20 -X POST "$MCP_URL/mcp" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"etablissements_finess_by_categorie","arguments":{"categorie":"labo","nom_commune":"Lille","limit":1}}}')
          if echo "$response" | jq -e '.error' > /dev/null; then
            echo "::error::etablissements_finess_by_categorie returned JSON-RPC error: $response"
            exit 1
          fi
          echo "::notice::etablissements_finess_by_categorie (index scan FINESS) ok"

      - name: Warm count_rpps_by_commune (via densite tool)
        # Chauffe la branche RPPS — count_rpps_by_commune (déjà tunée 5s,
        # pas modifiée par cette PR) + index rpps(code_insee). Le keep-warm
        # garde ces buffers chauds pour éviter que le 5s soit atteint sur
        # cold-start.
        run: |
          response=$(curl -sSL --fail-with-body --max-time 20 -X POST "$MCP_URL/mcp" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"densite_professionnels_sante","arguments":{"nom_commune":"Villeneuve-d'\''Ascq","savoir_faire_code":"SM04"}}}')
          if echo "$response" | jq -e '.error' > /dev/null; then
            echo "::error::densite_professionnels_sante returned JSON-RPC error: $response"
            exit 1
          fi
          echo "::notice::densite_professionnels_sante (count_rpps_by_commune) ok"
