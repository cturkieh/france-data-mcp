# .github/workflows/ingest-ameli.yml
name: Ingest Annuaire Sante Ameli

on:
  schedule:
    # Mondays 04:00 UTC. Ameli regenerates the dump weekly (typically over
    # the weekend); Monday morning catches the freshest version while
    # leaving FINESS its own slot on the 1st/15th.
    - cron: "0 4 * * 1"
  workflow_dispatch: {}

# Never run on pull_request - secrets are not available there, by design.

permissions:
  contents: read
  issues: write

concurrency:
  group: ingest-ameli
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Ameli is ~154 MB CSV / ~1.5 M rows + 35 K commune fetch. A full
    # ingestion runs in ~5-8 minutes locally; 30 minutes leaves head room
    # for slow data.gouv days and PostgREST contention.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - uses: actions/setup-node@v6
        with:
          # Node 22 for native WebSocket - same reason as FINESS workflow.
          # See ingest-finess.yml for the full postmortem.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Ameli ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: pnpm ingest:ameli

      # Alerte ops : adresses restant à géocoder (BAN) après ce run — logique
      # partagée RPPS/Ameli dans la composite action. `continue-on-error` :
      # une notif KO ne re-rouge jamais un cron déjà réussi (swap fait).
      - name: Notify pending BAN geocoding
        if: success()
        continue-on-error: true
        uses: ./.github/actions/notify-pending-geocode
        with:
          source: ameli
          supabase-url: ${{ secrets.SUPABASE_URL }}
          supabase-service-role-key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          resend-api-key: ${{ secrets.RESEND_API_KEY }}
          email-to: ${{ vars.NOTIFY_EMAIL_TO || 'cturkieh@gmail.com' }}
          email-from: ${{ vars.NOTIFY_EMAIL_FROM || 'France Data MCP <onboarding@resend.dev>' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # Vigie « run vert mais donnée malade » : run `partial` (canary/matview)
      # ou source TARIE (skips same_checksum au-delà de la cadence attendue).
      # `success()` : ne s'évalue que sur un cron réussi (le failed/cancelled a
      # son step) ; `continue-on-error` : une notif KO ne re-rouge jamais un
      # cron déjà réussi (swap fait). Cf. `.github/actions/notify-ingest-anomaly`.
      - name: Notify ingest anomaly
        if: success()
        continue-on-error: true
        uses: ./.github/actions/notify-ingest-anomaly
        with:
          source: ameli_ps
          supabase-url: ${{ secrets.SUPABASE_URL }}
          supabase-service-role-key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          resend-api-key: ${{ secrets.RESEND_API_KEY }}
          email-to: ${{ vars.NOTIFY_EMAIL_TO || 'cturkieh@gmail.com' }}
          email-from: ${{ vars.NOTIFY_EMAIL_FROM || 'France Data MCP <onboarding@resend.dev>' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # Échec OU run tué (`cancelled()` = timeout-minutes / annulation ; cf.
      # `.github/actions/notify-ingest-failure` — sans lui, un run tué est muet).
      - name: Alert on failure or cancelled run
        if: failure() || cancelled()
        uses: ./.github/actions/notify-ingest-failure
        with:
          source-label: Ameli
          ingest-log-source: ameli_ps
          issue-labels: ingestion-failure,ameli
          failure-modes: "AMELI_PS_CSV_URL stale (resource id rotated), unmatched_locality > 5% (INSEE drift), structural anomaly > 1% (column rename)."
          job-status: ${{ job.status }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          resend-api-key: ${{ secrets.RESEND_API_KEY }}
          email-to: ${{ vars.NOTIFY_EMAIL_TO || 'cturkieh@gmail.com' }}
          email-from: ${{ vars.NOTIFY_EMAIL_FROM || 'France Data MCP <onboarding@resend.dev>' }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
