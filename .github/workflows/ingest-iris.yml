# .github/workflows/ingest-iris.yml
name: Ingest IRIS (contours IGN + demographie INSEE)

on:
  schedule:
    # 20 janvier, 04:00 UTC. La donnee IRIS est ANNUELLE : l'IGN publie
    # « CONTOURS-IRIS » (geo 01/01/AAAA) ~decembre, l'INSEE diffuse RP/FILOSOFI
    # au niveau IRIS en fin d'annee. Un run mi-janvier capte le millesime frais
    # sans concurrencer les crons FINESS (1/15) / RPPS (5) / Ameli (lundis).
    - cron: "0 4 20 1 *"
  workflow_dispatch:
    inputs:
      force:
        description: "Forcer la re-ingestion meme si l'archive IGN est identique au dernier run (bypass court-circuit SHA256)."
        type: boolean
        default: false

# Never run on pull_request - secrets are not available there, by design.

permissions:
  contents: read
  issues: write

concurrency:
  group: ingest-iris
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Contours .7z ~40 Mo -> GeoPackage 159 Mo -> ogr2ogr CSV 261 Mo -> insert
    # ~48,6 K polygones via PostgREST. ~2 min en local ; 30 min couvre l'install
    # systeme (gdal-bin + p7zip), un data.geopf.fr lent et la contention PostgREST.
    timeout-minutes: 30
    steps:
      # Checkout EN PREMIER : l'alerte d'échec est une action LOCALE
      # (`./.github/actions/notify-ingest-failure`), lue dans le workspace —
      # sans checkout, un preflight qui échoue rendrait l'alerte MUETTE
      # (exactement la panne « secrets manquants » qu'elle doit rapporter).
      # Le preflight reste AVANT `pnpm install` (le poste coûteux).
      - uses: actions/checkout@v6

      # Preflight AVANT `pnpm install` (le checkout reste en 1er, cf. ci-dessus) : echoue vite et clairement si un secret
      # manque (convention pour tout nouveau workflow Supabase) plutot que de
      # crasher opaquement au milieu de l'ingestion.
      - name: Validate required secrets present
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=()
          [ -z "$SUPABASE_URL" ] && missing+=("SUPABASE_URL")
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing+=("SUPABASE_SERVICE_ROLE_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Secrets manquants : ${missing[*]} — configurer dans Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "Secrets requis presents."

      # Dependances SYSTEME specifiques a l'IRIS (geometrie polygones) :
      #   - gdal-bin : ogr2ogr (reprojection Lambert-93 -> WGS84 + export WKT)
      #   - p7zip-full : 7z (decompression de l'archive .7z IGN)
      # Les 4 autres crons (FINESS/RPPS/Ameli/CDS) sont pur CSV -> n'en ont pas besoin.
      - name: Install GDAL + 7z
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin p7zip-full
          ogr2ogr --version
          command -v 7z && echo "7z present"

      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run IRIS ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Input booleen type (jamais github.event.inputs.force qui stringifie
          # "false" -> truthy -> force a chaque cron). Voir ingest-rpps.yml.
          FORCE_REINGEST: ${{ inputs.force && '1' || '0' }}
        run: pnpm ingest:iris

      # Vigie « run vert mais donnée malade » : run `partial` (canary/matview)
      # ou source TARIE (skips same_checksum au-delà de la cadence attendue).
      # `success()` : ne s'évalue que sur un cron réussi (le failed/cancelled a
      # son step) ; `continue-on-error` : une notif KO ne re-rouge jamais un
      # cron déjà réussi (swap fait). Cf. `.github/actions/notify-ingest-anomaly`.
      - name: Notify ingest anomaly
        if: success()
        continue-on-error: true
        uses: ./.github/actions/notify-ingest-anomaly
        with:
          source: iris
          supabase-url: ${{ secrets.SUPABASE_URL }}
          supabase-service-role-key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          resend-api-key: ${{ secrets.RESEND_API_KEY }}
          email-to: ${{ vars.NOTIFY_EMAIL_TO || 'cturkieh@gmail.com' }}
          email-from: ${{ vars.NOTIFY_EMAIL_FROM || 'France Data MCP <onboarding@resend.dev>' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # Échec OU run tué (`cancelled()` = timeout-minutes / annulation ; cf.
      # `.github/actions/notify-ingest-failure` — sans lui, un run tué est muet).
      - name: Alert on failure or cancelled run
        if: failure() || cancelled()
        uses: ./.github/actions/notify-ingest-failure
        with:
          source-label: IRIS
          ingest-log-source: iris
          issue-labels: ingestion-failure,iris
          failure-modes: "IRIS_CONTOURS_URL périmée (millésime changé côté data.geopf.fr), ogr2ogr/7z absents (install système), row count hors [40K, 55K] (changement de schéma IGN), timeout PostgREST sur grosses géométries."
          job-status: ${{ job.status }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          resend-api-key: ${{ secrets.RESEND_API_KEY }}
          email-to: ${{ vars.NOTIFY_EMAIL_TO || 'cturkieh@gmail.com' }}
          email-from: ${{ vars.NOTIFY_EMAIL_FROM || 'France Data MCP <onboarding@resend.dev>' }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
